<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PIXANITHING</title>

    <!-- ===== SEO Meta Tags ===== -->
    <meta name="description" content="Login to PIXANITHING - Access premium creative content and tutorials." />
    <meta name="theme-color" content="#6C63FF" />

    <!-- ===== Fonts & Icons ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <!-- ===== Custom CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /* ===== LOGIN PAGE SPECIFIC STYLES ===== */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(108, 99, 255, 0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(255, 107, 53, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.6s ease;
        }

        .auth-card .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-card .auth-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            margin-bottom: 8px;
        }

        .auth-card .auth-header .logo i {
            color: var(--accent-primary);
            font-size: 32px;
        }

        .auth-card .auth-header .logo span {
            color: var(--accent-primary);
        }

        .auth-card .auth-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }

        .auth-card .auth-header p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 4px;
        }

        .auth-card .auth-header .welcome-back {
            display: inline-block;
            background: rgba(108, 99, 255, 0.08);
            border: 1px solid rgba(108, 99, 255, 0.12);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 13px;
            color: var(--accent-primary);
            font-weight: 500;
            margin-bottom: 12px;
        }

        /* ===== FORM STYLES ===== */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .auth-form .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .auth-form .form-group label .forgot-link {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-primary);
            text-decoration: none;
            transition: var(--transition);
        }

        .auth-form .form-group label .forgot-link:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        .auth-form .form-group .input-wrapper {
            position: relative;
        }

        .auth-form .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition);
        }

        .auth-form .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
        }

        .auth-form .form-group .input-wrapper input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.08);
        }

        .auth-form .form-group .input-wrapper input:focus + i,
        .auth-form .form-group .input-wrapper input:focus ~ i {
            color: var(--accent-primary);
        }

        .auth-form .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: var(--transition);
        }

        .auth-form .form-group .input-wrapper .toggle-password:hover {
            color: var(--text-primary);
        }

        .auth-form .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .auth-form .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .auth-form .form-options .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .auth-form .btn-login {
            padding: 16px;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .auth-form .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.3);
        }

        .auth-form .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-form .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .auth-form .btn-login.loading .spinner {
            display: inline-block;
        }

        .auth-form .btn-login.loading .btn-text {
            display: none;
        }

        .auth-form .error-message {
            display: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: rgba(244, 67, 54, 0.08);
            border: 1px solid rgba(244, 67, 54, 0.2);
            color: #F44336;
            font-size: 14px;
            margin-top: -8px;
        }

        .auth-form .error-message.show {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .auth-form .error-message i {
            margin-right: 8px;
        }

        /* ===== DIVIDER ===== */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0 16px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* ===== SOCIAL BUTTONS ===== */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-buttons .social-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-buttons .social-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .social-buttons .social-btn.google:hover {
            border-color: #DB4437;
            color: #DB4437;
        }

        .social-buttons .social-btn.github:hover {
            border-color: #333;
            color: var(--text-primary);
        }

        /* ===== SIGN UP LINK ===== */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .auth-footer p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .auth-footer a {
            color: var(--accent-primary);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 20px 28px;
            }

            .auth-card .auth-header .logo {
                font-size: 24px;
            }

            .auth-card .auth-header h1 {
                font-size: 20px;
            }

            .auth-form .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .social-buttons {
                flex-direction: column;
            }

            .auth-form .form-group .input-wrapper input {
                font-size: 14px;
                padding: 12px 14px 12px 40px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <!-- ===== HEADER ===== -->
                <div class="auth-header">
                    <a href="index.html" class="logo">
                        <i class="fas fa-play-circle"></i>
                        <span>PIXANI<span>THING</span></span>
                    </a>
                    <div class="welcome-back">
                        <i class="fas fa-arrow-left"></i> Welcome Back
                    </div>
                    <h1>Sign In</h1>
                    <p>Access your account and continue learning</p>
                </div>

                <!-- ===== FORM ===== -->
                <form class="auth-form" id="loginForm" novalidate>
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input
                                type="email"
                                id="email"
                                placeholder="hello@pixanithing.com"
                                required
                                autocomplete="email"
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">
                            Password
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                                minlength="6"
                            />
                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Toggle password visibility"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" checked />
                            Remember me
                        </label>
                    </div>

                    <!-- Error Message -->
                    <div class="error-message" id="errorMessage">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorText">Invalid email or password</span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="spinner"></span>
                        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
                    </button>
                </form>

                <!-- ===== DIVIDER ===== -->
                <div class="auth-divider">or continue with</div>

                <!-- ===== SOCIAL BUTTONS ===== -->
                <div class="social-buttons">
                    <button class="social-btn google" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn github" onclick="socialLogin('github')">
                        <i class="fab fa-github"></i> GitHub
                    </button>
                </div>

                <!-- ===== SIGN UP LINK ===== -->
                <div class="auth-footer">
                    <p>
                        Don't have an account?
                        <a href="signup.html">Create Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="js/script.js"></script>

    <!-- ===== PAGE-SPECIFIC JAVASCRIPT ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ===== TOGGLE PASSWORD VISIBILITY =====
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }

            // ===== LOGIN FORM SUBMISSION =====
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value.trim();
                    const rememberMe = document.getElementById('rememberMe').checked;

                    // ===== VALIDATION =====
                    if (!email || !password) {
                        showError('Please fill in all fields');
                        return;
                    }

                    if (!isValidEmail(email)) {
                        showError('Please enter a valid email address');
                        return;
                    }

                    if (password.length < 6) {
                        showError('Password must be at least 6 characters');
                        return;
                    }

                    // ===== LOADING STATE =====
                    loginBtn.classList.add('loading');
                    loginBtn.disabled = true;
                    hideError();

                    // ===== SIMULATE API CALL (Replace with actual API) =====
                    try {
                        // Simulate network delay
                        await new Promise(resolve => setTimeout(resolve, 1500));

                        // ===== DEMO LOGIN (Replace with real API) =====
                        // const response = await fetch('http://localhost:5000/api/users/login', {
                        //     method: 'POST',
                        //     headers: { 'Content-Type': 'application/json' },
                        //     body: JSON.stringify({ email, password })
                        // });
                        // const data = await response.json();

                        // if (response.ok && data.success) {
                        //     localStorage.setItem('authToken', data.token);
                        //     window.location.href = 'dashboard.html';
                        // } else {
                        //     showError(data.message || 'Login failed');
                        // }

                        // ===== DEMO LOGIN (Remove this in production) =====
                        if (email === 'demo@pixanithing.com' && password === 'password123') {
                            localStorage.setItem('authToken', 'demo_token_12345');
                            localStorage.setItem('userEmail', email);
                            if (rememberMe) {
                                localStorage.setItem('rememberMe', 'true');
                            }
                            window.location.href = 'dashboard.html';
                        } else if (email === 'admin@pixanithing.com' && password === 'admin123') {
                            localStorage.setItem('authToken', 'admin_token_67890');
                            localStorage.setItem('userEmail', email);
                            localStorage.setItem('userRole', 'admin');
                            if (rememberMe) {
                                localStorage.setItem('rememberMe', 'true');
                            }
                            window.location.href = 'dashboard.html';
                        } else {
                            showError('Invalid email or password. Try demo@pixanithing.com / password123');
                        }

                    } catch (error) {
                        console.error('Login error:', error);
                        showError('Network error. Please try again.');
                    } finally {
                        loginBtn.classList.remove('loading');
                        loginBtn.disabled = false;
                    }
                });
            }

            // ===== HELPER FUNCTIONS =====
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function showError(message) {
                errorText.textContent = message;
                errorMessage.classList.add('show');
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            // ===== SOCIAL LOGIN =====
            window.socialLogin = function(provider) {
                // Replace with actual OAuth implementation
                alert(`🔐 ${provider.charAt(0).toUpperCase() + provider.slice(1)} login coming soon!\n\nThis would redirect to ${provider} OAuth.`);
                console.log(`Social login with ${provider}`);
            };

            // ===== CHECK FOR SAVED SESSION =====
            const savedToken = localStorage.getItem('authToken');
            if (savedToken) {
                // Auto-redirect if already logged in (optional)
                // window.location.href = 'dashboard.html';
            }

            console.log('✅ Login page loaded successfully!');
        });
    </script>

</body>
</html>
